<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Régie — Quiz d'Alan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }

    body {
      display: flex;
      flex-direction: column;
      padding: 20px;
      background: linear-gradient(135deg, #171735 0%, #2a2a5e 100%);
      color: white;
      font-family: "Fredoka", Arial, sans-serif;
    }

    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .vue { display: none; flex: 1; min-height: 0; flex-direction: column; }
    .vue.active { display: flex; }

    .entete { text-align: center; margin-bottom: 16px; }
    .entete p { margin: 0; color: #d0d0e5; }
    .entete h1 { margin: 4px 0 0; font-size: 2rem; }

    .titre-section { margin: 0 0 10px; font-size: 1.3rem; }

    .boutons-jeux {
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      gap: 10px;
    }

    .bouton {
      padding: 14px;
      border: 0;
      border-radius: 16px;
      background: rgba(37, 37, 77, 0.9);
      border: 2px solid rgba(255,255,255,0.25);
      color: white;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .bouton:disabled { opacity: 0.6; }

    .bouton-jeu {
      min-height: 78px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      text-align: center;
    }

    .bouton-jeu .icone {
      display: grid;
      place-items: center;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: #ffcf4a;
      color: #171735;
      font-weight: 700;
    }

    /* ====== CONTRÔLES DU JEU 1 ====== */
    #controles-jeu1 {
      display: none;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 16px;
    }

    #controles-jeu1 .bouton {
      min-height: 90px;
      font-size: 1.05rem;
      box-shadow: 0 5px 0 rgba(0,0,0,0.35);
    }

    .bouton-quitter {
      background: #ff6b6b !important;
      color: #171735 !important;
      font-weight: 700;
    }

    .bouton-retour {
      padding: 9px 13px;
      border: 0;
      border-radius: 10px;
      background: #ffcf4a;
      color: #171735;
      font: inherit;
      font-weight: 600;
      cursor: pointer;
    }

    .barre-gestion {
      flex: 0 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .barre-gestion h2 { margin: 0; font-size: 1.5rem; text-align: center; }

    #compteur-joueurs { color: #ffcf4a; white-space: nowrap; }

    #liste-joueurs {
      flex: 1;
      min-height: 0;
      overflow: auto;
      margin: 0;
      padding: 4px;
      list-style: none;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 8px;
      align-content: start;
    }

    .ligne-joueur {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 12px;
      background: rgba(37, 37, 77, 0.9);
      border: 1px solid rgba(255,255,255,0.2);
    }

    .actions-joueur { display: flex; gap: 6px; }

    .actions-joueur button {
      padding: 8px 10px;
      border: 0;
      border-radius: 10px;
      background: #ffcf4a;
      color: #171735;
      font: inherit;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
    }

    .message-liste { color: #d0d0e5; }

    .statut {
      flex: 0 0 auto;
      min-height: 1.5em;
      margin: 12px 0 0;
      text-align: center;
      color: #ffcf4a;
    }

    @media (max-width: 700px) {
      .boutons-jeux { grid-template-columns: repeat(2, 1fr); }
      #controles-jeu1 { grid-template-columns: 1fr; }
      #liste-joueurs { grid-template-columns: 1fr; }
      .bouton-jeu { min-height: 56px; padding: 6px; }
      .bouton-jeu .icone { display: none; }
      .bouton-jeu .texte-bouton strong { font-size: 0.9rem; }
      .barre-gestion h2 { font-size: 1.1rem; }
    }
  </style>
</head>

<body>
  <main>
    <section id="vue-accueil" class="vue active">
      <header class="entete">
        <p>Régie animateur</p>
        <h1>Quiz d'Alan 🎤</h1>
      </header>

      <section class="commandes" aria-label="Commandes de gestion">
        <h2 class="titre-section">Gestion</h2>

        <!-- Les 5 boutons de jeux -->
        <div class="boutons-jeux" id="menu-jeux">
          <button class="bouton bouton-jeu" id="jeu-1" type="button">
            <span class="icone">1</span>
            <span class="texte-bouton"><strong>Jeu 1</strong></span>
          </button>
          <button class="bouton bouton-jeu" id="jeu-2" type="button">
            <span class="icone">2</span>
            <span class="texte-bouton"><strong>Jeu 2</strong></span>
          </button>
          <button class="bouton bouton-jeu" id="jeu-3" type="button">
            <span class="icone">3</span>
            <span class="texte-bouton"><strong>Jeu 3</strong></span>
          </button>
          <button class="bouton bouton-jeu" id="jeu-4" type="button">
            <span class="icone">4</span>
            <span class="texte-bouton"><strong>Jeu 4</strong></span>
          </button>
          <button class="bouton bouton-jeu" id="jeu-5" type="button">
            <span class="icone">5</span>
            <span class="texte-bouton"><strong>Jeu 5</strong></span>
          </button>
        </div>

        <!-- Contrôles du Mytho-mètre (masqués au départ) -->
        <div id="controles-jeu1">
          <button class="bouton" id="question-suivante" type="button">
            ⏭️ Question suivante
          </button>
          <button class="bouton" id="afficher-reponse" type="button">
            💡 Afficher la réponse
          </button>
          <button class="bouton" id="equipe-suivante" type="button">
            👥 Équipe suivante
          </button>
          <button class="bouton bouton-quitter" id="quitter-jeu1" type="button">
            🚪 Quitter le jeu
          </button>
        </div>
      </section>
    </section>

    <section id="vue-joueurs" class="vue" aria-live="polite">
      <div class="barre-gestion">
        <button class="bouton-retour" id="retour" type="button">← Retour</button>
        <h2>Joueurs inscrits</h2>
        <span id="compteur-joueurs">0 joueur</span>
      </div>

      <ul id="liste-joueurs">
        <li class="message-liste">Chargement des joueurs…</li>
      </ul>
    </section>

    <p class="statut" id="statut">En attente de tes commandes…</p>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import {
      getDatabase, ref, onValue, set, remove, get
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";
    import { QUESTIONS } from "./questions.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-Hv3dU-vu8B0I0IAk3AUdIiqv1Ykmn4x8",
      authDomain: "nouvelan-a256f.firebaseapp.com",
      databaseURL: "https://nouvelan-a256f-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nouvelan-a256f",
      storageBucket: "nouvelan-a256f.firebasestorage.app",
      messagingSenderId: "312028300581",
      appId: "1:312028300581:web:f2f53dc6f57523dc5d06cc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const statut = document.getElementById("statut");
    const listeJoueurs = document.getElementById("liste-joueurs");
    const compteurJoueurs = document.getElementById("compteur-joueurs");
    const vueAccueil = document.getElementById("vue-accueil");
    const vueJoueurs = document.getElementById("vue-joueurs");

    function afficherVue(vue) {
      vueAccueil.classList.toggle("active", vue === "accueil");
      vueJoueurs.classList.toggle("active", vue === "joueurs");
    }

    // ====== GESTION DES VUES ======
    document.getElementById("gestion").addEventListener("click", () => afficherVue("joueurs"));
    document.getElementById("retour").addEventListener("click", () => afficherVue("accueil"));

    // ====== LISTE DES JOUEURS ======
    onValue(ref(db, "joueurs"), (snapshot) => {
      const joueurs = snapshot.val();
      listeJoueurs.innerHTML = "";

      if (!joueurs) {
        listeJoueurs.innerHTML = `<li class="message-liste">Aucun joueur pour l'instant…</li>`;
        compteurJoueurs.textContent = "0 joueur";
        return;
      }

      const entrees = Object.entries(joueurs);
      compteurJoueurs.textContent = `${entrees.length} joueur${entrees.length > 1 ? "s" : ""}`;

      for (const [cle, joueur] of entrees) {
        const li = document.createElement("li");
        li.className = "ligne-joueur";

        const nom = document.createElement("span");
        nom.textContent = joueur?.pseudo || "Joueur";
        li.appendChild(nom);

        const actions = document.createElement("div");
        actions.className = "actions-joueur";

        const boutonSuppr = document.createElement("button");
        boutonSuppr.textContent = "❌";
        boutonSuppr.addEventListener("click", async () => {
          await remove(ref(db, `joueurs/${cle}`));
        });
        actions.appendChild(boutonSuppr);

        li.appendChild(actions);
        listeJoueurs.appendChild(li);
      }
    }, (error) => {
      console.error(error);
      statut.textContent = "Erreur de chargement des joueurs.";
    });

    // ====== JEU 1 : LE MYTHO-MÈTRE ======
    const menuJeux = document.getElementById("menu-jeux");
    const controlesJeu1 = document.getElementById("controles-jeu1");

    // Suivi local de l'état du jeu 1 (pour savoir où on en est).
    let questionIndex = 0;
    let reponseAffichee = false;

    onValue(ref(db, "partie/jeu1"), (snapshot) => {
      const donnees = snapshot.val();
      if (!donnees) return;
      questionIndex = donnees.questionIndex ?? 0;
      reponseAffichee = donnees.reponseAffichee ?? false;
    });

    // Clic sur Jeu 1 : lance le jeu et bascule vers les contrôles.
    document.getElementById("jeu-1").addEventListener("click", async (event) => {
      const bouton = event.currentTarget;
      bouton.disabled = true;
      statut.textContent = "Lancement du jeu 1…";
      try {
        // On repart de la première question, sans réponse affichée.
        await set(ref(db, "partie/jeu1"), { questionIndex: 0, reponseAffichee: false });
        await set(ref(db, "partie/etat"), "jeu_1_lance");
        menuJeux.style.display = "none";
        controlesJeu1.style.display = "grid";
        statut.textContent = "Le Mytho-mètre est lancé ! 🎭";
      } catch (error) {
        console.error(error);
        statut.textContent = "Impossible de lancer le jeu 1.";
      } finally {
        bouton.disabled = false;
      }
    });

    // Question suivante.
    document.getElementById("question-suivante").addEventListener("click", async () => {
      if (questionIndex + 1 >= QUESTIONS.length) {
        statut.textContent = "C'était la dernière question ! 🎉";
        return;
      }
      try {
        await set(ref(db, "partie/jeu1"), {
          questionIndex: questionIndex + 1,
          reponseAffichee: false
        });
        statut.textContent = `Question ${questionIndex + 2} affichée !`;
      } catch (error) {
        console.error(error);
        statut.textContent = "Impossible de passer à la question suivante.";
      }
    });

    // Afficher la réponse (bascule révélé / masqué).
    document.getElementById("afficher-reponse").addEventListener("click", async () => {
      try {
        await set(ref(db, "partie/jeu1/reponseAffichee"), !reponseAffichee);
        statut.textContent = reponseAffichee
          ? "Réponse masquée. 🙈"
          : "Réponse révélée sur l'écran ! 💡";
        reponseAffichee = !reponseAffichee;
      } catch (error) {
        console.error(error);
        statut.textContent = "Impossible d'afficher la réponse.";
      }
    });

    // Équipe suivante (placeholder pour l'instant).
    document.getElementById("equipe-suivante").addEventListener("click", () => {
      statut.textContent = "Le défilement des équipes arrivera bientôt ! 😉";
    });

    // Quitter le jeu 1 : retour au menu + retour des écrans au début.
    document.getElementById("quitter-jeu1").addEventListener("click", async (event) => {
      const bouton = event.currentTarget;
      bouton.disabled = true;
      try {
        await set(ref(db, "partie/etat"), "menu");
        await remove(ref(db, "partie/jeu1"));
        controlesJeu1.style.display = "none";
        menuJeux.style.display = "grid";
        statut.textContent = "Tu as quitté le jeu 1. Choisis un autre jeu ! 👋";
      } catch (e) {
        console.error(e);
        statut.textContent = "Impossible de quitter le jeu. Vérifie la connexion à Firebase.";
      } finally {
        bouton.disabled = false;
      }
    });

    // Les autres jeux : placeholder pour l'instant.
    for (const numero of [2, 3, 4, 5]) {
      document.getElementById(`jeu-${numero}`).addEventListener("click", () => {
        statut.textContent = `Le jeu ${numero} n'est pas encore prêt ! 😉`;
      });
    }

    document.getElementById("classement").addEventListener("click", () => {
      statut.textContent = "Le classement sera affiché ici quand les scores seront disponibles.";
    });
  </script>
</body>
</html>
