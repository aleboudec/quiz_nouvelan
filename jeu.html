<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rejoindre le quiz d’Alan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      --couleur-equipe: #171735;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--couleur-equipe);
      color: white;
      font-family: "Fredoka", Arial, sans-serif;
      transition: background 0.8s ease;
    }

    main {
      width: min(520px, 100%);
      padding: 42px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 28px;
      background: rgba(37, 37, 77, 0.94);
      box-shadow: 0 18px 50px rgba(0,0,0,0.3);
      text-align: center;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 8vw, 3rem);
    }

    p {
      margin: 0 0 28px;
      color: #d0d0e5;
      font-size: 1.1rem;
    }

    label {
      display: block;
      margin-bottom: 10px;
      text-align: left;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 2px solid transparent;
      border-radius: 14px;
      outline: none;
      background: white;
      color: #171735;
      font: inherit;
      font-size: 1.1rem;
    }

    input:focus {
      border-color: #ffcf4a;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 50px;
      background: #ffcf4a;
      color: #171735;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #c87924;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #message {
      min-height: 1.5em;
      margin: 18px 0 0;
    }

    .retour {
      display: inline-block;
      margin-top: 22px;
      color: #d0d0e5;
      text-decoration: none;
    }

    .retour:hover {
      color: #ffcf4a;
    }
  </style>
</head>

<body>
  <main>
    <h1>Bienvenue au quiz ! 🎉</h1>
    <p>Entre ton pseudo pour rejoindre la partie.</p>

    <form id="formulaire">
      <label for="pseudo">Ton pseudo</label>
      <input
        id="pseudo"
        name="pseudo"
        type="text"
        placeholder="Ex. Alan"
        maxlength="20"
        autocomplete="nickname"
        required
      >
      <button id="bouton" type="submit">Rejoindre la partie 🚀</button>
      <p id="message" aria-live="polite"></p>
    </form>

  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      set,
      get,
      update,
      onValue
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-Hv3dU-vu8B0I0IAk3AUdIiqv1Ykmn4x8",
      authDomain: "nouvelan-a256f.firebaseapp.com",
      databaseURL: "https://nouvelan-a256f-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nouvelan-a256f",
      storageBucket: "nouvelan-a256f.firebasestorage.app",
      messagingSenderId: "312028300581",
      appId: "1:312028300581:web:f2f53dc6f57523dc5d06cc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const formulaire = document.getElementById("formulaire");
    const champPseudo = document.getElementById("pseudo");
    const bouton = document.getElementById("bouton");
    const message = document.getElementById("message");
    const carte = document.querySelector("main");

    const equipesConfig = [
      { nom: "Équipe des Lions", animal: "🦁", couleur: "#ff5555" },
      { nom: "Équipe des Loups", animal: "🐺", couleur: "#55aaff" },
      { nom: "Équipe des Ours", animal: "🐻", couleur: "#55d98b" },
      { nom: "Équipe des Renards", animal: "🦊", couleur: "#ff9d42" }
    ];

    let joueurId = null;
    let arretEcouteEquipe = null;
    let arretEcouteLancement = null;

    formulaire.addEventListener("submit", async (event) => {
      event.preventDefault();

      const pseudo = champPseudo.value.trim();
      if (!pseudo) return;

      bouton.disabled = true;
      message.textContent = "Connexion en cours…";

      try {
        // 1️⃣ On regarde tous les joueurs existants
        const donneesJoueurs = (await get(ref(db, "joueurs"))).val() || {};

        // 2️⃣ On cherche un joueur NON bloqué avec exactement ce pseudo
        let idExistant = null;
        for (const [id, joueur] of Object.entries(donneesJoueurs)) {
          if (joueur && joueur.pseudo === pseudo) {
            if (joueur.bloque) {
              message.textContent = "Ce pseudo est bloqué par l’organisateur. 🚫";
              bouton.disabled = false;
              return;
            }
            idExistant = id;
            break;
          }
        }

        if (idExistant) {
          // 3️⃣ Pseudo existant → on le reconnecte (pas de nouveau joueur)
          joueurId = idExistant;
          await update(ref(db, `joueurs/${joueurId}`), { rejointLe: Date.now() });
          message.textContent = `Content de te revoir ${pseudo} ! Reconnexion… 🎉`;
        } else {
          // 4️⃣ Nouveau pseudo → on crée le joueur
          const nouveauJoueur = push(ref(db, "joueurs"));
          joueurId = nouveauJoueur.key;

          await set(nouveauJoueur, {
            pseudo,
            rejointLe: Date.now()
          });

          message.textContent = "Tu as rejoint la partie ! En attente des équipes…";
        }

        localStorage.setItem("joueurId", joueurId);
        localStorage.setItem("idJoueur", joueurId);
        localStorage.setItem("pseudoJoueur", pseudo);

        ecouterEquipe();
        ecouterLancement();
      } catch (error) {
        console.error(error);
        message.textContent = "Erreur de connexion. Réessaie dans un instant.";
        bouton.disabled = false;
      }
    });

    function ecouterEquipe() {
      if (arretEcouteEquipe) arretEcouteEquipe();

      arretEcouteEquipe = onValue(ref(db, "partie/equipes"), (snapshot) => {
        const equipes = snapshot.val();
        if (!equipes || !joueurId) return;

        const equipesTriees = Object.entries(equipes)
          .sort(([cleA], [cleB]) => {
            const numeroA = Number(cleA.match(/\d+/)?.[0] || 0);
            const numeroB = Number(cleB.match(/\d+/)?.[0] || 0);
            return numeroA - numeroB;
          })
          .slice(0, 4);

        for (let index = 0; index < equipesTriees.length; index++) {
          const [cleEquipe, equipe] = equipesTriees[index];
          const joueursEquipe = equipe?.joueurs || {};

          // L'identifiant Firebase du joueur sert à retrouver sa propre équipe.
          const joueur = joueursEquipe[joueurId];

          if (!joueur) continue;

          const config = equipesConfig[index];
          const nomEquipe = config.nom;
          const couleur = config.couleur;

          document.body.style.setProperty("--couleur-equipe", couleur);
          document.body.style.backgroundColor = couleur;
          carte.style.borderColor = couleur;
          carte.style.boxShadow = `0 18px 50px ${couleur}88`;

          message.textContent =
            `Tu es dans ${nomEquipe} ${config.animal} ! En attente du lancement…`;

          localStorage.setItem("equipeJoueur", cleEquipe);
          localStorage.setItem("couleurEquipe", couleur);
          localStorage.setItem("nomEquipe", nomEquipe);

          return;
        }
      }, (error) => {
        console.error("Erreur de chargement des équipes :", error);
        message.textContent = "Impossible de récupérer ton équipe.";
      });
    }

    function ecouterLancement() {
      if (arretEcouteLancement) arretEcouteLancement();

      arretEcouteLancement = onValue(ref(db, "partie/etat"), (snapshot) => {
        const etat = snapshot.val();
        if (etat === "jeu_lance" || etat === "jeu_1_lance") {
          window.location.href = "jeu1_player.html";
        }
      });
    }
  </script>
</body>
</html>
