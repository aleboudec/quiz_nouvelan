<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rejoindre le quiz d’Alan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      --couleur-equipe: #171735;
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: var(--couleur-equipe);
      color: white;
      font-family: "Fredoka", Arial, sans-serif;
      transition: background 0.8s ease;
    }

    main {
      width: min(520px, 100%);
      padding: 42px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 28px;
      background: rgba(37, 37, 77, 0.94);
      box-shadow: 0 18px 50px rgba(0,0,0,0.3);
      text-align: center;
      transition: border-color 0.5s ease, box-shadow 0.5s ease;
    }

    h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 8vw, 3rem);
    }

    p {
      margin: 0 0 28px;
      color: #d0d0e5;
      font-size: 1.1rem;
    }

    label {
      display: block;
      margin-bottom: 10px;
      text-align: left;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 2px solid transparent;
      border-radius: 14px;
      outline: none;
      background: white;
      color: #171735;
      font: inherit;
      font-size: 1.1rem;
    }

    input:focus {
      border-color: #ffcf4a;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 50px;
      background: #ffcf4a;
      color: #171735;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #c87924;
    }

    button:disabled {
      opacity: 0.65;
      cursor: wait;
    }

    #message { min-height: 1.5em; margin: 18px 0 0; }
    #zone-jeu { display: none; margin-top: 20px; padding: 16px; border: 1px solid rgba(255,255,255,.2); border-radius: 18px; background: rgba(23,23,53,.55); text-align: left; }
    #zone-jeu.visible { display: block; }
    #zone-jeu h2 { margin: 0 0 10px; color: #ffcf4a; }
    #zone-jeu ol { padding-left: 24px; }
    #zone-jeu li { margin: 7px 0; padding: 8px; border-radius: 8px; background: rgba(255,255,255,.1); }
    .message-jeu { font-size: 1.15rem; font-weight: 600; }


    .retour {
      display: inline-block;
      margin-top: 22px;
      color: #d0d0e5;
      text-decoration: none;
    }

    .retour:hover {
      color: #ffcf4a;
    }
  </style>
</head>

<body>
  <main>
    <h1>Bienvenue au quiz ! 🎉</h1>
    <p>Entre ton pseudo pour rejoindre la partie.</p>

    <form id="formulaire">
      <label for="pseudo">Ton pseudo</label>
      <input
        id="pseudo"
        name="pseudo"
        type="text"
        placeholder="Ex. Alan"
        maxlength="20"
        autocomplete="nickname"
        required
      >
      <button id="bouton" type="submit">Rejoindre la partie 🚀</button>
      <p id="message" aria-live="polite"></p>
    </form>

    <section id="zone-jeu" aria-live="polite">
      <h2 id="titre-zone-jeu">🎮 Partie</h2>
      <div id="contenu-zone-jeu"></div>
    </section>

    <a class="retour" href="index.html">← Retour à l’accueil</a>
  </main>

  <script type="module">
    import { QUESTIONS, REGLES } from "./questions.js";
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      push,
      set,
      onValue
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-Hv3dU-vu8B0I0IAk3AUdIiqv1Ykmn4x8",
      authDomain: "nouvelan-a256f.firebaseapp.com",
      databaseURL: "https://nouvelan-a256f-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nouvelan-a256f",
      storageBucket: "nouvelan-a256f.firebasestorage.app",
      messagingSenderId: "312028300581",
      appId: "1:312028300581:web:f2f53dc6f57523dc5d06cc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const formulaire = document.getElementById("formulaire");
    const champPseudo = document.getElementById("pseudo");
    const bouton = document.getElementById("bouton");
    const message = document.getElementById("message");
    const carte = document.querySelector("main");

    const equipesConfig = [
      { nom: "Équipe des Lions", animal: "🦁", couleur: "#ff5555" },
      { nom: "Équipe des Loups", animal: "🐺", couleur: "#55aaff" },
      { nom: "Équipe des Ours", animal: "🐻", couleur: "#55d98b" },
      { nom: "Équipe des Renards", animal: "🦊", couleur: "#ff9d42" }
    ];

    let joueurId = null;
    let arretEcouteEquipe = null;
    let arretEcouteLancement = null;

    formulaire.addEventListener("submit", async (event) => {
      event.preventDefault();

      const pseudo = champPseudo.value.trim();
      if (!pseudo) return;

      bouton.disabled = true;
      message.textContent = "Connexion en cours…";

      try {
        const nouveauJoueur = push(ref(db, "joueurs"));
        localStorage.setItem("idJoueur", nouveauJoueur.key);
        joueurId = nouveauJoueur.key;

        await set(nouveauJoueur, {
          pseudo,
          rejointLe: Date.now()
        });

        localStorage.setItem("joueurId", joueurId);
        localStorage.setItem("pseudoJoueur", pseudo);

        message.textContent = "Tu as rejoint la partie ! En attente des équipes…";

        ecouterEquipe();
        ecouterLancement();
      } catch (error) {
        console.error(error);
        message.textContent = "Erreur de connexion. Réessaie dans un instant.";
        bouton.disabled = false;
      }
    });

    function ecouterEquipe() {
      if (arretEcouteEquipe) arretEcouteEquipe();

      arretEcouteEquipe = onValue(ref(db, "partie/equipes"), (snapshot) => {
        const equipes = snapshot.val();
        if (!equipes || !joueurId) return;

        const equipesTriees = Object.entries(equipes)
          .sort(([cleA], [cleB]) => {
            const numeroA = Number(cleA.match(/\d+/)?.[0] || 0);
            const numeroB = Number(cleB.match(/\d+/)?.[0] || 0);
            return numeroA - numeroB;
          })
          .slice(0, 4);

        for (let index = 0; index < equipesTriees.length; index++) {
          const [cleEquipe, equipe] = equipesTriees[index];
          const joueursEquipe = equipe?.joueurs || {};

          // L'identifiant Firebase du joueur sert à retrouver sa propre équipe.
          const joueur = joueursEquipe[joueurId];

          if (!joueur) continue;

          const config = equipesConfig[index];
          const nomEquipe = config.nom;
          const couleur = config.couleur;

          document.body.style.setProperty("--couleur-equipe", couleur);
          document.body.style.backgroundColor = couleur;
          carte.style.borderColor = couleur;
          carte.style.boxShadow = `0 18px 50px ${couleur}88`;

          message.textContent =
            `Tu es dans ${nomEquipe} ${config.animal} ! En attente du lancement…`;

          localStorage.setItem("equipeJoueur", cleEquipe);
          localStorage.setItem("couleurEquipe", couleur);
          localStorage.setItem("nomEquipe", nomEquipe);

          return;
        }
      }, (error) => {
        console.error("Erreur de chargement des équipes :", error);
        message.textContent = "Impossible de récupérer ton équipe.";
      });
    }

    function ecouterLancement() {
      if (arretEcouteLancement) arretEcouteLancement();
      arretEcouteLancement = onValue(ref(db, "partie/jeu"), snapshot => {
        const jeu = snapshot.val();
        const zone = document.getElementById("zone-jeu");
        const contenu = document.getElementById("contenu-zone-jeu");
        const titre = document.getElementById("titre-zone-jeu");
        contenu.replaceChildren();
        if (!jeu) { zone.classList.remove("visible"); return; }
        zone.classList.add("visible");
        const numero = Math.max(1, Math.min(5, Number(jeu.numero)||1));
        const index = Math.max(0, Math.min(4, Number(jeu.questionIndex)||0));
        const regle = REGLES[numero-1];
        const question = QUESTIONS[numero-1]?.[index];
        titre.textContent = `${regle.icone} Jeu ${numero} — ${regle.titre}`;
        const ajouter = (tag, texte, classe="") => { const e=document.createElement(tag); e.textContent=texte; if(classe)e.className=classe; contenu.appendChild(e); return e; };
        if (jeu.phase === "regles") {
          ajouter("p", regle.texte, "message-jeu");
          ajouter("p", `Exemple : ${regle.exemple}`);
        } else if (jeu.phase === "question") {
          ajouter("p", question?.texte || "La question sera bientôt disponible.", "message-jeu");
        } else if (jeu.phase === "reponses") {
          ajouter("p", question?.texte || "Question indisponible.", "message-jeu");
          const liste=document.createElement("ol");
          (question?.reponses||[]).forEach(r=>{const li=document.createElement("li");li.textContent=r;liste.appendChild(li);});
          contenu.appendChild(liste);
        } else if (jeu.phase === "equipe_suivante") {
          ajouter("p", "Merci de patienter, l’équipe suivante va jouer !", "message-jeu");
        } else if (jeu.phase === "scores") {
          ajouter("p", "Le classement des scores est affiché sur l’écran principal. Regarde devant toi !", "message-jeu");
        }
      }, error => { console.error("Erreur de lecture du jeu :", error); message.textContent = "Impossible de suivre la partie en direct."; });
    }
  </script>
<script type="module" src="https://static.cloudflareinsights.com/beacon.min.js/vce701823e78c4301a35b7e07294d87301792088814092" integrity="sha512-UKNk8GbxkABxKcXYuLkO16EleLGUkcvJWtpSNmExE0Too3ZaFAxTscNWEc1OdAv5/BikHawapSCaiD2XCmp+Bw==" data-cf-beacon='{"version":"2024.11.0","token":"8607d2a720d14b038279025b2b5a82e5","spa":2}' crossorigin="anonymous"></script>
</body>
</html>
