<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rejoindre le quiz d’Alan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 24px;
      display: grid;
      place-items: center;
      background: #171735;
      color: white;
      font-family: "Fredoka", Arial, sans-serif;
    }

    main {
      width: min(520px, 100%);
      padding: 42px;
      border: 1px solid rgba(255,255,255,0.18);
      border-radius: 28px;
      background: #25254d;
      box-shadow: 0 18px 50px rgba(0,0,0,0.3);
      text-align: center;
    }

    h1 { margin: 0 0 12px; font-size: clamp(2rem, 8vw, 3rem); }
    p { margin: 0 0 28px; color: #d0d0e5; font-size: 1.1rem; }

    label {
      display: block;
      margin-bottom: 10px;
      text-align: left;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 16px;
      border: 2px solid transparent;
      border-radius: 14px;
      outline: none;
      background: white;
      color: #171735;
      font: inherit;
      font-size: 1.1rem;
    }

    input:focus { border-color: #ffcf4a; }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 16px;
      border: 0;
      border-radius: 50px;
      background: #ffcf4a;
      color: #171735;
      font: inherit;
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 0 #c87924;
    }

    button:disabled { opacity: 0.65; cursor: wait; }

    #message { min-height: 1.5em; margin: 18px 0 0; }

    .retour {
      display: inline-block;
      margin-top: 22px;
      color: #d0d0e5;
      text-decoration: none;
    }

    .retour:hover { color: #ffcf4a; }
  </style>
</head>

<body>
  <main>
    <h1>Bienvenue au quiz ! 🎉</h1>
    <p>Entre ton pseudo pour rejoindre la partie.</p>

    <form id="formulaire">
      <label for="pseudo">Ton pseudo</label>
      <input
        id="pseudo"
        name="pseudo"
        type="text"
        placeholder="Ex. Alan"
        maxlength="20"
        autocomplete="nickname"
        required
      >
      <button id="bouton" type="submit">Rejoindre la partie 🚀</button>
      <p id="message" aria-live="polite"></p>
    </form>

    <a class="retour" href="index.html">← Retour à l’accueil</a>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import {
  getDatabase,
  ref,
  push,
  set,
  onValue
} from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-Hv3dU-vuB8U0IAk3AUdIiqv1Ykmn4x8",
      authDomain: "nouvelan-a256f.firebaseapp.com",
      databaseURL: "https://nouvelan-a256f-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nouvelan-a256f",
      storageBucket: "nouvelan-a256f.firebasestorage.app",
      messagingSenderId: "312028300581",
      appId: "1:312028300581:web:f2f53dc6f57523dc5d06cc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const formulaire = document.getElementById("formulaire");
    const champPseudo = document.getElementById("pseudo");
    const bouton = document.getElementById("bouton");
    const message = document.getElementById("message");

    formulaire.addEventListener("submit", async (event) => {
      event.preventDefault();

      const pseudo = champPseudo.value.trim();
      if (!pseudo) return;

      bouton.disabled = true;
      message.textContent = "Connexion en cours…";

      try {
        const nouveauJoueur = push(ref(db, "joueurs"));
        await set(nouveauJoueur, {
          pseudo,
          rejointLe: Date.now()
        });

       message.textContent = "Tu as rejoint la partie ! En attente du lancement…";
formulaire.querySelector("button").disabled = true;

// Le téléphone attend le signal envoyé depuis la tablette
onValue(ref(db, "partie/etat"), (snapshot) => {
  if (snapshot.val() === "jeu_lance") {
    window.location.href = "question.html";
  }
});
      } catch (error) {
        console.error(error);
        message.textContent = "Erreur de connexion. Réessaie dans un instant.";
        bouton.disabled = false;
      }
    });
  </script>
</body>
</html>
