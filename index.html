<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alan t’en pose, des questions !</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      overflow: hidden;
      color: white;
      font-family: "Fredoka", Arial, sans-serif;

      /* Remplace animateur.png par le nom exact de ta photo */
      background: #171735 url("animateur.png") center / cover no-repeat;
    }

    /* Voile sombre pour que le titre reste lisible */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(12, 13, 40, 0.88),
        rgba(12, 13, 40, 0.58),
        rgba(12, 13, 40, 0.2)
      );
    }

    main {
      position: relative;
      z-index: 1;
      width: min(90%, 900px);
      padding: 48px 30px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      background: rgba(12, 15, 50, 0.48);
      box-shadow: 0 15px 60px rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(5px);
    }

    .surtitre {
      margin: 0 0 14px;
      color: #ffcf4a;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 36px;
      font-size: clamp(3rem, 8vw, 6rem);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -2px;
      text-shadow: 4px 5px 0 #09091d;
    }

    h1 span {
      color: #ffcf4a;
    }

    .bouton {
      display: inline-block;
      padding: 17px 46px;
      border-radius: 50px;
      background: #ffcf4a;
      color: #171735;
      font-size: 1.4rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 7px 0 #c87924;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .bouton:hover {
      transform: translateY(-4px);
      box-shadow: 0 11px 0 #c87924;
    }

    @media (max-width: 600px) {
      body {
        background-position: 58% center;
      }

      main {
        width: 100%;
        padding: 38px 20px;
      }

      .surtitre {
        font-size: 0.8rem;
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="surtitre">Le grand quiz d’Alan</p>

    <h1>
      Alan t’en pose,<br>
      <span>des questions&nbsp;!</span>
    </h1>

    <a class="bouton" href="jeu.html">Jouer&nbsp;! 🎉</a>
  </main>
</body>
</html>
