<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alan t’en pose, des questions !</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 30px;
      overflow-x: hidden;
      background: #171735;
      color: white;
      font-family: "Fredoka", Arial, sans-serif;
    }

    .accueil {
      width: min(1100px, 100%);
      min-height: 580px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .texte {
      position: relative;
      z-index: 1;
      flex: 1;
      padding: 30px 0;
    }

    .texte p {
      margin: 0 0 14px;
      color: #ffcf4a;
      font-size: 1.15rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      max-width: 650px;
      margin: 0 0 36px;
      font-size: clamp(3.4rem, 8vw, 6.5rem);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -2px;
      text-shadow: 4px 5px 0 #09091d;
    }

    h1 span {
      color: #ffcf4a;
    }

    .bouton {
      display: inline-block;
      padding: 17px 46px;
      border-radius: 50px;
      background: #ffcf4a;
      color: #171735;
      font-size: 1.4rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 7px 0 #c87924;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .bouton:hover {
      transform: translateY(-4px);
      box-shadow: 0 11px 0 #c87924;
    }

    .personnage {
      align-self: stretch;
      flex: 0 1 45%;
      display: flex;
      align-items: end;
      justify-content: center;
      min-width: 0;
    }

    .personnage img {
      display: block;
      width: 100%;
      max-height: 620px;
      object-fit: contain;
      object-position: bottom;
      filter: drop-shadow(0 12px 22px rgba(0, 0, 0, 0.35));
    }

    @media (max-width: 700px) {
      .accueil {
        min-height: auto;
        flex-direction: column;
        text-align: center;
        gap: 0;
      }

      .texte {
        padding: 45px 0 10px;
      }

      h1 {
        margin-inline: auto;
      }

      .personnage {
        width: min(420px, 100%);
        flex: none;
        max-height: 42vh;
      }
    }
  </style>
</head>

<body>
  <main class="accueil">
    <section class="texte">
      <p>Le grand quiz d’Alan</p>
      <h1>Alan t’en pose,<br><span>des questions&nbsp;!</span></h1>
      <a class="bouton" href="jeu.html">Jouer&nbsp;! 🎉</a>
    </section>

    <div class="personnage">
      <img src="animateur-detoure.png" alt="L’animateur du quiz">
    </div>
  </main>
</body>
</html>
