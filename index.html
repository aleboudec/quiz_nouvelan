<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alan t’en pose, des questions !</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html {
      min-height: 100%;
    }

    body {
      min-height: 100vh;
      margin: 0;
      padding: 32px;
      background:
        radial-gradient(ellipse at top right, #34346e 0, transparent 45%),
        #171735;
      color: white;
      font-family: "Fredoka", Arial, sans-serif;
      overflow-x: hidden;
      overflow-y: auto;
    }

    .contenu {
      width: min(1200px, 100%);
      min-height: calc(100vh - 64px);
      margin: 0 auto;
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(0, 1.1fr);
      align-items: center;
      gap: 40px;
      padding: 24px 0;
    }

    h1 {
      margin: 0 0 28px;
      font-size: clamp(3rem, 6vw, 5.5rem);
      line-height: 1.05;
    }

    h1 span {
      color: #ffcf4a;
    }

    .bouton {
      display: inline-block;
      padding: 17px 30px;
      border-radius: 18px;
      background: #ffcf4a;
      color: #171735;
      font-size: 1.4rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 8px 0 #d99d18;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .bouton:hover {
      transform: translateY(3px);
      box-shadow: 0 5px 0 #d99d18;
    }

    .panneaux {
      display: grid;
      gap: 18px;
      min-width: 0;
    }

    .carte {
      min-width: 0;
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      border-radius: 22px;
      background: rgba(20, 21, 57, 0.9);
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
    }

    .carte h2 {
      margin: 0 0 8px;
      font-size: 1.6rem;
    }

    .compteur {
      margin: 0 0 14px;
      color: #ffcf4a;
    }

    #liste-joueurs {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    #liste-joueurs li,
    .joueur-equipe {
      min-width: 0;
      padding: 8px 10px;
      border-radius: 11px;
      background: rgba(255, 255, 255, 0.12);
      overflow-wrap: anywhere;
    }

    #liste-joueurs li {
      text-align: center;
    }

    .vide {
      color: #d0d0e5;
    }

    /* Les équipes restent cachées tant qu'elles ne sont pas créées */
    #section-equipes {
      display: none;
    }

    #section-equipes.visible {
      display: block;
      animation: apparition 0.5s ease both;
    }

    #liste-equipes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 10px;
    }

    .carte-equipe {
      min-width: 0;
      padding: 12px;
      border: 1px solid rgba(255, 207, 74, 0.4);
      border-radius: 16px;
      background: rgba(255, 207, 74, 0.09);
      animation: apparition 0.5s ease both;
    }

    .carte-equipe h3 {
      margin: 0 0 8px;
      color: #ffcf4a;
      font-size: 1.15rem;
    }

    .joueurs-equipe {
      display: grid;
      gap: 6px;
    }

    @keyframes apparition {
      from {
        opacity: 0;
        transform: translateY(12px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @media (max-width: 800px) {
      body {
        padding: 22px;
      }

      .contenu {
        min-height: auto;
        grid-template-columns: 1fr;
        align-items: start;
        gap: 28px;
        padding: 24px 0;
      }

      h1 {
        font-size: clamp(2.8rem, 11vw, 4.5rem);
      }
    }

    @media (max-width: 480px) {
      .carte {
        padding: 16px;
      }

      #liste-joueurs {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      #liste-equipes {
        grid-template-columns: 1fr;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <main class="contenu">
    <section>
      <h1>
        Alan t’en pose,<br>
        <span>des questions&nbsp;!</span>
      </h1>

      
    </section>

    <div class="panneaux">
      <section class="carte" aria-live="polite">
        <h2>🎮 Joueurs connectés</h2>
        <p class="compteur" id="compteur-joueurs">Chargement…</p>

        <ul id="liste-joueurs">
          <li class="vide">En attente des joueurs…</li>
        </ul>
      </section>

      <section class="carte" id="section-equipes" aria-live="polite">
        <h2>🏆 Les équipes sont prêtes !</h2>
        <p class="compteur" id="compteur-equipes"></p>
        <div id="liste-equipes"></div>
      </section>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-Hv3dU-vuB8U0IAk3AUdIiqv1Ykmn4x8",
      authDomain: "nouvelan-a256f.firebaseapp.com",
      databaseURL: "https://nouvelan-a256f-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nouvelan-a256f",
      storageBucket: "nouvelan-a256f.firebasestorage.app",
      messagingSenderId: "312028300581",
      appId: "1:312028300581:web:f2f53dc6f57523dc5d06cc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const listeJoueurs = document.getElementById("liste-joueurs");
    const compteurJoueurs = document.getElementById("compteur-joueurs");
    const sectionEquipes = document.getElementById("section-equipes");
    const listeEquipes = document.getElementById("liste-equipes");
    const compteurEquipes = document.getElementById("compteur-equipes");

    // Afficher les joueurs connectés
    onValue(ref(db, "joueurs"), (snapshot) => {
      const donnees = snapshot.val() || {};
      const joueurs = Object.values(donnees)
        .map(joueur => joueur?.pseudo)
        .filter(Boolean);

      compteurJoueurs.textContent =
        `${joueurs.length} joueur${joueurs.length > 1 ? "s" : ""}`;

      listeJoueurs.replaceChildren();

      if (joueurs.length === 0) {
        const ligne = document.createElement("li");
        ligne.className = "vide";
        ligne.textContent = "En attente des joueurs…";
        listeJoueurs.appendChild(ligne);
        return;
      }

      joueurs.forEach((pseudo) => {
        const ligne = document.createElement("li");
        ligne.textContent = `🎉 ${pseudo}`;
        listeJoueurs.appendChild(ligne);
      });
    }, (error) => {
      compteurJoueurs.textContent = "Impossible de charger les joueurs.";
      console.error("Erreur lors du chargement des joueurs :", error);
    });

    // Afficher les équipes créées depuis la régie
    onValue(ref(db, "partie/equipes"), (snapshot) => {
      const equipes = snapshot.val();

      listeEquipes.replaceChildren();

      if (!equipes) {
        sectionEquipes.classList.remove("visible");
        return;
      }

      const equipesTriees = Object.entries(equipes).sort(([cleA], [cleB]) => {
        const numeroA = Number(cleA.match(/\d+/)?.[0] || 0);
        const numeroB = Number(cleB.match(/\d+/)?.[0] || 0);
        return numeroA - numeroB;
      });

      let totalJoueurs = 0;

      equipesTriees.forEach(([cleEquipe, equipe], index) => {
        const joueurs = Object.values(equipe.joueurs || {});
        totalJoueurs += joueurs.length;

        const carte = document.createElement("article");
        carte.className = "carte-equipe";
        carte.style.animationDelay = `${index * 100}ms`;

        const titre = document.createElement("h3");
        titre.textContent = equipe.nom || cleEquipe;

        const liste = document.createElement("div");
        liste.className = "joueurs-equipe";

        joueurs.forEach((joueur) => {
          const nom = document.createElement("div");
          nom.className = "joueur-equipe";
          nom.textContent = `🎉 ${joueur.pseudo || "Joueur"}`;
          liste.appendChild(nom);
        });

        carte.append(titre, liste);
        listeEquipes.appendChild(carte);
      });

      compteurEquipes.textContent =
        `${equipesTriees.length} équipe${equipesTriees.length > 1 ? "s" : ""} · ` +
        `${totalJoueurs} joueur${totalJoueurs > 1 ? "s" : ""}`;

      sectionEquipes.classList.add("visible");
    }, (error) => {
      console.error("Erreur lors du chargement des équipes :", error);
    });
  </script>
</body>
</html>
