<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alan t’en pose, des questions !</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 6vw;
      display: flex;
      align-items: center;
      color: white;
      font-family: "Fredoka", Arial, sans-serif;
      background: #171735 url("animateur.png") center / cover no-repeat;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(12, 13, 40, 0.94) 0%,
        rgba(12, 13, 40, 0.82) 48%,
        rgba(12, 13, 40, 0.28) 100%
      );
    }

    .contenu {
      position: relative;
      z-index: 1;
      width: min(1200px, 100%);
      margin: auto;
      display: grid;
      grid-template-columns: 1fr 0.8fr;
      align-items: center;
      gap: 50px;
    }

    h1 {
      margin: 0 0 36px;
      font-size: clamp(3rem, 6vw, 6rem);
      line-height: 0.98;
      letter-spacing: -2px;
      text-shadow: 4px 5px 0 #09091d;
    }

    h1 span { color: #ffcf4a; }

    .bouton {
      display: inline-block;
      padding: 17px 40px;
      border-radius: 50px;
      background: #ffcf4a;
      color: #171735;
      font-size: 1.3rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 7px 0 #c87924;
      transition: transform 0.2s;
    }

    .bouton:hover { transform: translateY(-4px); }

    .carte {
      padding: 28px;
      border: 1px solid rgba(255,255,255,0.25);
      border-radius: 24px;
      background: rgba(20, 21, 57, 0.82);
      backdrop-filter: blur(8px);
      box-shadow: 0 15px 45px rgba(0,0,0,0.3);
    }

    .carte h2 {
      margin: 0 0 8px;
      font-size: 2rem;
    }

    #compteur {
      margin: 0 0 18px;
      color: #ffcf4a;
    }

    #liste-joueurs {
      display: grid;
      gap: 10px;
      max-height: 45vh;
      overflow-y: auto;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    #liste-joueurs li {
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(255,255,255,0.12);
      overflow-wrap: anywhere;
    }

    .vide { color: #d0d0e5; }

    @media (max-width: 750px) {
      body {
        padding: 28px;
        background-position: 65% center;
      }

      body::before {
        background: linear-gradient(
          0deg,
          rgba(12,13,40,0.97) 0%,
          rgba(12,13,40,0.78) 65%,
          rgba(12,13,40,0.35) 100%
        );
      }

      .contenu {
        grid-template-columns: 1fr;
        gap: 30px;
        padding: 30px 0;
      }

      h1 { font-size: clamp(2.8rem, 12vw, 4.5rem); }
      .carte { padding: 22px; }
      #liste-joueurs { max-height: 35vh; }
    }
  </style>
</head>

<body>
  <main class="contenu">
    <section>
      <h1>Alan t’en pose,<br><span>des questions&nbsp;!</span></h1>
      <a class="bouton" href="jeu.html">Jouer&nbsp;! 🎉</a>
    </section>

    <section class="carte" aria-live="polite">
      <h2>🎮 Joueurs connectés</h2>
      <p id="compteur">Chargement…</p>
      <ul id="liste-joueurs">
        <li class="vide">En attente des joueurs…</li>
      </ul>
    </section>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-Hv3dU-vuB8U0IAk3AUdIiqv1Ykmn4x8",
      authDomain: "nouvelan-a256f.firebaseapp.com",
      databaseURL: "https://nouvelan-a256f-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nouvelan-a256f",
      storageBucket: "nouvelan-a256f.firebasestorage.app",
      messagingSenderId: "312028300581",
      appId: "1:312028300581:web:f2f53dc6f57523dc5d06cc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const liste = document.getElementById("liste-joueurs");
    const compteur = document.getElementById("compteur");

    onValue(ref(db, "joueurs"), (snapshot) => {
      const joueurs = snapshot.val() || {};
      const pseudos = Object.values(joueurs)
        .map(joueur => joueur.pseudo)
        .filter(Boolean);

      compteur.textContent =
        `${pseudos.length} joueur${pseudos.length > 1 ? "s" : ""}`;

      liste.replaceChildren();

      if (pseudos.length === 0) {
        const ligne = document.createElement("li");
        ligne.className = "vide";
        ligne.textContent = "En attente des joueurs…";
        liste.appendChild(ligne);
        return;
      }

      pseudos.forEach((pseudo) => {
        const ligne = document.createElement("li");
        ligne.textContent = `🎉 ${pseudo}`;
        liste.appendChild(ligne);
      });
    }, (error) => {
      compteur.textContent = "Impossible de charger les joueurs.";
      console.error(error);
    });
  </script>
</body>
</html>
