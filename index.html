<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alan t’en pose, des questions !</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      padding: 6vw;
      overflow: hidden;
      color: white;
      font-family: "Fredoka", Arial, sans-serif;
      background: #171735 url("animateur.png") center / cover no-repeat;
    }

    /* Assombrit surtout la gauche, pour laisser ta tête visible à droite */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(12, 13, 40, 0.9) 0%,
        rgba(12, 13, 40, 0.72) 42%,
        rgba(12, 13, 40, 0.08) 75%
      );
    }

    main {
      position: relative;
      z-index: 1;
      width: min(58%, 720px);
      padding: 30px 0;
    }

    .surtitre {
      margin: 0 0 14px;
      color: #ffcf4a;
      font-size: 1rem;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 36px;
      font-size: clamp(3rem, 7vw, 6rem);
      font-weight: 700;
      line-height: 0.98;
      letter-spacing: -2px;
      text-shadow: 4px 5px 0 #09091d;
    }

    h1 span {
      color: #ffcf4a;
    }

    .bouton {
      display: inline-block;
      padding: 17px 46px;
      border-radius: 50px;
      background: #ffcf4a;
      color: #171735;
      font-size: 1.4rem;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 7px 0 #c87924;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .bouton:hover {
      transform: translateY(-4px);
      box-shadow: 0 11px 0 #c87924;
    }

    @media (max-width: 700px) {
      body {
        align-items: flex-end;
        padding: 28px;
        background-position: 65% center;
      }

      body::before {
        background: linear-gradient(
          0deg,
          rgba(12, 13, 40, 0.95) 0%,
          rgba(12, 13, 40, 0.75) 48%,
          rgba(12, 13, 40, 0.08) 100%
        );
      }

      main {
        width: 100%;
        padding: 0 0 20px;
      }

      h1 {
        font-size: clamp(2.8rem, 13vw, 4.5rem);
      }
    }
  </style>
</head>

<body>
  <main>
    <p class="surtitre">Le grand quiz d’Alan</p>

    <h1>
      Alan t’en pose,<br>
      <span>des questions&nbsp;!</span>
    </h1>

    <a class="bouton" href="jeu.html">Jouer&nbsp;! 🎉</a>
  </main>
</body>
</html>
