<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Alan t’en pose, des questions !</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: white;
      background: #10112b url("animateur.png") center / cover no-repeat;
    }

    /* Assombrit l’image pour que le titre reste bien lisible */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: linear-gradient(
        90deg,
        rgba(8, 10, 35, 0.8),
        rgba(8, 10, 35, 0.3),
        rgba(8, 10, 35, 0.15)
      );
    }

    main {
      position: relative;
      z-index: 1;
      width: min(90%, 800px);
      padding: 48px 30px;
      text-align: center;
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 28px;
      background: rgba(12, 15, 50, 0.58);
      box-shadow: 0 15px 60px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(8px);
    }

    h1 {
      margin: 0 0 32px;
      font-size: clamp(2.5rem, 8vw, 5.5rem);
      line-height: 1.05;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
    }

    .accent {
      color: #ffd34e;
    }

    .button {
      display: inline-block;
      padding: 18px 54px;
      border: 0;
      border-radius: 999px;
      background: linear-gradient(135deg, #ffdf61, #ff9d32);
      color: #1c1744;
      font-size: 1.4rem;
      font-weight: 800;
      text-decoration: none;
      box-shadow: 0 8px 25px rgba(255, 168, 48, 0.35);
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .button:hover {
      transform: translateY(-4px) scale(1.04);
      box-shadow: 0 12px 32px rgba(255, 168, 48, 0.5);
    }

    .button:focus-visible {
      outline: 3px solid white;
      outline-offset: 5px;
    }

    @media (max-width: 600px) {
      body {
        background-position: 58% center;
      }

      main {
        padding: 38px 20px;
      }
    }
  </style>
</head>

<body>
  <main>
    <h1>
      Alan t’en pose,<br>
      <span class="accent">des questions&nbsp;!</span>
    </h1>

    <a class="button" href="jeu.html">JOUER 🎉</a>
  </main>
</body>
</html>
