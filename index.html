<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quiz d’Alan</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      padding: 24px;
      display: grid;
      place-items: center;
      overflow-x: hidden;
      background:
        radial-gradient(circle at top left, #34346b 0, transparent 35%),
        #171735;
      color: white;
      font-family: "Fredoka", Arial, sans-serif;
    }

    button {
      font: inherit;
    }

    #ecran-bienvenue {
      width: 100%;
      min-height: calc(100vh - 48px);
      display: grid;
      place-items: center;
      text-align: center;
    }

    #ecran-bienvenue h1 {
      margin: 0;
      font-size: clamp(3rem, 10vw, 8rem);
      line-height: 1;
      text-shadow: 4px 5px 0 #09091d;
    }

    #ecran-bienvenue p {
      margin: 20px 0 0;
      color: #ffcf4a;
      font-size: clamp(1.2rem, 3vw, 2rem);
    }

    .contenu {
      display: none;
      width: min(1250px, 100%);
      margin: 0 auto;
      grid-template-columns: 0.9fr 1.1fr;
      align-items: start;
      gap: 40px;
    }

    body.mode-jeu .contenu {
      display: grid;
    }

    body.mode-jeu #ecran-bienvenue {
      display: none;
    }

    .intro {
      align-self: start;
    }

    h1 {
      margin: 0 0 30px;
      font-size: clamp(3rem, 6vw, 6rem);
      line-height: 0.98;
      letter-spacing: -2px;
      text-shadow: 4px 5px 0 #09091d;
    }

    .intro h1 span {
      color: #ffcf4a;
    }

    .bloc-qr {
      width: fit-content;
      max-width: 100%;
      text-align: center;
    }

    .bloc-qr p {
      margin: 0 0 12px;
      font-size: 1.1rem;
    }

    #qr-code {
      width: 220px;
      height: 220px;
      padding: 10px;
      border-radius: 16px;
      background: white;
    }

    #lien-jeu-texte {
      display: block;
      max-width: 100%;
      margin-top: 10px;
      color: #ffcf4a;
      overflow-wrap: anywhere;
    }

    .panneaux {
      display: grid;
      gap: 18px;
    }

    .carte {
      padding: 20px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 20px;
      background: rgba(255, 255, 255, 0.08);
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.18);
    }

    .carte h2 {
      margin: 0 0 8px;
      font-size: clamp(1.3rem, 3vw, 2rem);
    }

    .compteur {
      margin: 0 0 14px;
      color: #ffcf4a;
    }

    #liste-joueurs {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 8px;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    #liste-joueurs li,
    .joueur-equipe {
      padding: 9px 12px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.09);
      overflow-wrap: anywhere;
    }

    #liste-joueurs .vide {
      color: #c9c9df;
    }

    #liste-equipes {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .carte-equipe {
      min-width: 0;
      padding: 14px;
      border: 2px solid var(--couleur-equipe, #ffcf4a);
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.06);
    }

    .carte-equipe h3 {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 0 10px;
      font-size: 1.15rem;
    }

    .totem {
      font-size: 1.6rem;
    }

    .liste-joueurs-equipe {
      display: grid;
      gap: 6px;
    }

    .joueur-equipe {
      padding: 7px 9px;
      font-size: 0.95rem;
    }

    #activer-son {
      position: fixed;
      right: 16px;
      bottom: 16px;
      z-index: 5;
      padding: 12px 16px;
      border: 0;
      border-radius: 12px;
      background: #ffcf4a;
      color: #171735;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 18px rgba(0, 0, 0, 0.25);
    }

    #activer-son:disabled {
      opacity: 0.8;
      cursor: default;
    }

    @media (max-width: 800px) {
      body {
        padding: 16px;
      }

      .contenu {
        grid-template-columns: 1fr;
        gap: 24px;
      }

      .intro {
        text-align: center;
      }

      .bloc-qr {
        margin: 0 auto;
      }
    }

    @media (max-width: 480px) {
      #liste-equipes {
        grid-template-columns: 1fr;
      }

      .carte {
        padding: 15px;
      }

      #qr-code {
        width: 180px;
        height: 180px;
      }
    }
  </style>
</head>

<body>
  <section id="ecran-bienvenue">
    <div>
      <h1>Bienvenue&nbsp;!</h1>
      <p>Le jeu va bientôt commencer…</p>
    </div>
  </section>

  <main class="contenu">
    <section class="intro">
      <h1>
        Alan t’en pose,<br>
        <span>des questions&nbsp;!</span>
      </h1>

      <div class="bloc-qr">
        <p>📱 Scanne ce QR code pour rejoindre le jeu</p>

        <a id="lien-jeu" href="jeu.html">
          <img id="qr-code" alt="QR code pour accéder à la page du jeu">
        </a>

        <a id="lien-jeu-texte" href="jeu.html"></a>
      </div>
    </section>

    <div class="panneaux">
      <section class="carte carte-joueurs" aria-live="polite">
        <h2>🎮 Joueurs connectés</h2>
        <p class="compteur" id="compteur-joueurs">Chargement…</p>

        <ul id="liste-joueurs">
          <li class="vide">En attente des joueurs…</li>
        </ul>
      </section>

      <section class="carte" id="section-equipes" aria-live="polite">
        <h2>🎆 Les équipes sont prêtes !</h2>
        <p class="compteur" id="compteur-equipes"></p>
        <div id="liste-equipes"></div>
      </section>
    </div>
  </main>

  <audio id="sonIntro" src="intro.wav" preload="auto"></audio>
  <button id="activer-son" type="button">🔊 Activer le son</button>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import {
      getDatabase,
      ref,
      onValue
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-Hv3dU-vuB8U0IAk3AUdIiqv1Ykmn4x8",
      authDomain: "nouvelan-a256f.firebaseapp.com",
      databaseURL: "https://nouvelan-a256f-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nouvelan-a256f",
      storageBucket: "nouvelan-a256f.firebasestorage.app",
      messagingSenderId: "312028300581",
      appId: "1:312028300581:web:f2f53dc6f57523dc5d06cc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const sonIntro = document.getElementById("sonIntro");
    const boutonActiverSon = document.getElementById("activer-son");

    // À faire une fois sur l’écran public pour autoriser la lecture audio.
    boutonActiverSon.addEventListener("click", async () => {
      try {
        sonIntro.muted = true;
        await sonIntro.play();
        sonIntro.pause();
        sonIntro.currentTime = 0;
        sonIntro.muted = false;

        boutonActiverSon.textContent = "✅ Son activé";
        boutonActiverSon.disabled = true;
      } catch (error) {
        console.error("Impossible d’activer le son :", error);
        sonIntro.muted = false;
        boutonActiverSon.textContent =
          "Erreur audio : vérifie intro.wav";
      }
    });

    // La régie écrit les commandes dans partie/introCommande.
    onValue(
      ref(db, "partie/introCommande"),
      async (snapshot) => {
        const commande = snapshot.val();

        if (!commande) return;

        if (commande.action === "lecture") {
          try {
            sonIntro.currentTime = 0;
            await sonIntro.play();
            console.log("Intro sonore lancée.");
          } catch (error) {
            console.error(
              "Lecture bloquée ou fichier intro.wav introuvable :",
              error
            );
          }
        }

        if (commande.action === "arret") {
          sonIntro.pause();
          sonIntro.currentTime = 0;
          console.log("Intro sonore arrêtée.");
        }
      },
      (error) => {
        console.error("Erreur d’écoute de la commande audio :", error);
      }
    );

    // La régie commande l’écran en modifiant partie/affichage.
    onValue(ref(db, "partie/affichage"), (snapshot) => {
      document.body.classList.toggle("mode-jeu", snapshot.val() === "jeu");
    });

    // Le QR code et le lien pointent vers jeu.html, dans le même dossier.
    const urlJeu = new URL("jeu.html", window.location.href).href;

    document.getElementById("lien-jeu").href = urlJeu;

    const lienJeuTexte = document.getElementById("lien-jeu-texte");
    lienJeuTexte.href = urlJeu;
    lienJeuTexte.textContent = urlJeu;

    document.getElementById("qr-code").src =
      `https://api.qrserver.com/v1/create-qr-code/?size=220x220&data=${encodeURIComponent(urlJeu)}`;

    const listeJoueurs = document.getElementById("liste-joueurs");
    const compteurJoueurs = document.getElementById("compteur-joueurs");
    const listeEquipes = document.getElementById("liste-equipes");
    const compteurEquipes = document.getElementById("compteur-equipes");

    // Affiche les joueurs connectés en temps réel.
    onValue(
      ref(db, "joueurs"),
      (snapshot) => {
        const donnees = snapshot.val() || {};
        const joueurs = Object.values(donnees)
          .filter((joueur) => joueur && joueur.pseudo);

        compteurJoueurs.textContent =
          `${joueurs.length} joueur${joueurs.length === 1 ? "" : "s"}`;

        listeJoueurs.replaceChildren();

        if (joueurs.length === 0) {
          const ligne = document.createElement("li");
          ligne.className = "vide";
          ligne.textContent = "En attente des joueurs…";
          listeJoueurs.appendChild(ligne);
          return;
        }

        joueurs.forEach((joueur) => {
          const ligne = document.createElement("li");
          ligne.textContent = `🎉 ${joueur.pseudo}`;
          listeJoueurs.appendChild(ligne);
        });
      },
      (error) => {
        console.error("Erreur de chargement des joueurs :", error);
        compteurJoueurs.textContent = "Erreur de chargement";
      }
    );

    // Affiche les équipes créées par la régie.
    onValue(
      ref(db, "partie/equipes"),
      (snapshot) => {
        const equipes = snapshot.val();
        listeEquipes.replaceChildren();

        if (!equipes) {
          compteurEquipes.textContent = "Les équipes ne sont pas encore créées.";
          return;
        }

        const entreesEquipes = Object.entries(equipes);
        let totalJoueurs = 0;

        entreesEquipes.forEach(([cle, equipe], index) => {
          const joueursEquipe = Object.values(equipe?.joueurs || {})
            .filter((joueur) => joueur && joueur.pseudo);

          totalJoueurs += joueursEquipe.length;

          const carte = document.createElement("article");
          carte.className = "carte-equipe";

          const titre = document.createElement("h3");
          const totem = document.createElement("span");
          totem.className = "totem";
          totem.textContent = ["🦁", "🐯", "🐺", "🦊"][index % 4];

          const nomEquipe = document.createElement("span");
          nomEquipe.textContent = equipe?.nom || cle;

          titre.append(totem, nomEquipe);

          const liste = document.createElement("div");
          liste.className = "liste-joueurs-equipe";

          if (joueursEquipe.length === 0) {
            const vide = document.createElement("div");
            vide.className = "joueur-equipe";
            vide.textContent = "En attente d’un joueur…";
            liste.appendChild(vide);
          } else {
            joueursEquipe.forEach((joueur) => {
              const nom = document.createElement("div");
              nom.className = "joueur-equipe";
              nom.textContent = `🎉 ${joueur.pseudo}`;
              liste.appendChild(nom);
            });
          }

          carte.append(titre, liste);
          listeEquipes.appendChild(carte);
        });

        compteurEquipes.textContent =
          `${totalJoueurs} joueur${totalJoueurs === 1 ? "" : "s"} réparti${totalJoueurs === 1 ? "" : "s"} dans ${entreesEquipes.length} équipe${entreesEquipes.length === 1 ? "" : "s"}`;
      },
      (error) => {
        console.error("Erreur de chargement des équipes :", error);
        compteurEquipes.textContent = "Impossible de charger les équipes.";
      }
    );
  </script>
</body>
</html>
