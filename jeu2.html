<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blind Test Ciné & Séries</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 4vw;
      color: white;
      font-family: "Fredoka", Arial, sans-serif;
      background: linear-gradient(135deg, #171735 0%, #2a2a5e 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    #zone-blindtest {
      display: grid;
      grid-template-columns: 1fr;
      gap: 24px;
      max-width: 1100px;
      margin: 0 auto;
      width: 100%;
      text-align: center;
    }

    .carte-ecoute {
      padding: 60px 40px;
      border: 3px solid #ffcf4a;
      border-radius: 24px;
      background: rgba(20, 21, 57, 0.9);
      box-shadow: 0 0 35px rgba(255, 207, 74, 0.25);
    }

    .icone-son {
      font-size: 5rem;
      display: inline-block;
      animation: pulse 1.2s infinite ease-in-out;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.15); }
    }

    .titre-ecoute {
      font-size: clamp(1.8rem, 4vw, 3rem);
      margin: 20px 0 10px;
      text-shadow: 2px 2px 0 #09091d;
    }

    .indice {
      font-size: clamp(1.2rem, 2.5vw, 1.8rem);
      color: #ffcf4a;
      margin-top: 15px;
    }

    .carte-reponse {
      padding: 40px;
      border: 3px solid #55d98b;
      border-radius: 24px;
      background: rgba(85, 217, 139, 0.15);
      box-shadow: 0 0 30px rgba(85, 217, 139, 0.35);
    }

    .reponse-titre {
      font-size: clamp(2rem, 4.5vw, 3.5rem);
      font-weight: 700;
      color: #55d98b;
      text-shadow: 2px 2px 0 #09091d;
      margin: 0 0 12px;
    }

    .reponse-sous-titre {
      font-size: clamp(1.3rem, 2.5vw, 2rem);
      color: #ffffff;
      margin: 0;
    }

    .attente {
      padding: 30px;
      text-align: center;
      color: #d0d0e5;
      font-size: 1.8rem;
    }
  </style>
</head>

<body>
  <div id="zone-blindtest">
    <p class="attente">En attente du premier extrait… 🎵</p>
  </div>

  <!-- Lecteur audio caché -->
  <audio id="lecteur-audio"></audio>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-app.js";
    import {
      getDatabase, ref, onValue
    } from "https://www.gstatic.com/firebasejs/13.2.0/firebase-database.js";
    import { EXTRAITS } from "./blindtest.js";

    const firebaseConfig = {
      apiKey: "AIzaSyB-Hv3dU-vu8B0I0IAk3AUdIiqv1Ykmn4x8",
      authDomain: "nouvelan-a256f.firebaseapp.com",
      databaseURL: "https://nouvelan-a256f-default-rtdb.europe-west1.firebasedatabase.app",
      projectId: "nouvelan-a256f",
      storageBucket: "nouvelan-a256f.firebasestorage.app",
      messagingSenderId: "312028300581",
      appId: "1:312028300581:web:f2f53dc6f57523dc5d06cc"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const zoneBlindtest = document.getElementById("zone-blindtest");
    const lecteurAudio = document.getElementById("lecteur-audio");
    let dernierIndexJoue = null;

    // Retour à l'accueil si la régie quitte le jeu 2
    onValue(ref(db, "partie/etat"), (snapshot) => {
      if (snapshot.val() !== "jeu_2_lance") {
        lecteurAudio.pause();
        window.location.href = "index.html";
      }
    });

    // Affichage et lecture de l'extrait courant
    onValue(ref(db, "partie/jeu2"), (snapshot) => {
      const donnees = snapshot.val();
      if (!donnees || donnees.extraitIndex == null) {
        lecteurAudio.pause();
        dernierIndexJoue = null;
        zoneBlindtest.innerHTML = `<p class="attente">En attente du premier extrait… 🎵</p>`;
        return;
      }

      const extrait = EXTRAITS[donnees.extraitIndex];
      if (!extrait) {
        lecteurAudio.pause();
        zoneBlindtest.innerHTML = `<p class="attente">Fin du Blind Test ! 🎉</p>`;
        return;
      }

      // Lance la musique uniquement si on vient de changer d'extrait
      if (dernierIndexJoue !== donnees.extraitIndex) {
        dernierIndexJoue = donnees.extraitIndex;
        lecteurAudio.src = extrait.audio; // ex: "./sons/pirates.mp3"
        lecteurAudio.play().catch(err => console.log("Lecture auto bloquée :", err));
      }

      // Affichage avant ou après révélation
      if (!donnees.reponseAffichee) {
        zoneBlindtest.innerHTML = `
          <div class="carte-ecoute">
            <div class="icone-son">🎧</div>
            <div class="titre-ecoute">Extrait n°${donnees.extraitIndex + 1}</div>
            ${extrait.indice ? `<div class="indice">💡 Indice : ${extrait.indice}</div>` : ""}
          </div>
        `;
      } else {
        zoneBlindtest.innerHTML = `
          <div class="carte-reponse">
            <div class="reponse-titre">🎬 ${extrait.titre}</div>
            <p class="reponse-sous-titre">${extrait.details || ""}</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
